name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-package
          path: ${{ steps.buildozer.outputs.filename }}
